services:
  packaging-watcher:
    build:
      context: .
    image: vr-foraging-packaging-watcher:local
    container_name: vr-foraging-packaging-watcher
    restart: unless-stopped
    # Some session folders on the NFS share only grant access to specific AD
    # principals (no EVERYONE@ ACE) -- root has no AD identity, so it gets denied.
    # Run as the host user whose UID the export actually recognizes (from .env).
    # Defaults to root (the old behaviour) if HOST_UID/HOST_GID aren't set --
    # only needed once you actually hit that ACL gap.
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      RUN_MODE: cron
      CRON_SCHEDULE: "*/10 * * * *"
      RUN_AT_STARTUP: "true"

      # Empty means every subject -- use "animal1, animal2" for multiple subjects.
      # Comes from .env so it can be overridden per-deployment without editing this file.
      VRFW_SUBJECTS: "${VRFW_SUBJECTS}"
      # "today" is resolved once at container start; a long-running container
      # keeps the floor it started with rather than re-evaluating it daily.
      VRFW_MIN_SESSION_DATE: today
      # Sessions live one level under a per-subject folder: <subject>/<session>.
      VRFW_SESSION_GLOB: "*/*"
      VRFW_REQUIRE_FILES: "[]"

      # `bucket@region` (the AIND convention) also works here.
      VRFW_S3_BUCKET: aind-scratch-data
      VRFW_S3_PREFIX: vr-foraging/replenishment-temp-sharing
      VRFW_AWS_REGION: us-west-2
      VRFW_CHECK_REMOTE_BEFORE_UPLOAD: "true"
      AWS_PROFILE: "${AWS_PROFILE}"

      VRFW_SETTLE_SECONDS: "300"
      VRFW_POLL_INTERVAL_SECONDS: "60"  # only used when RUN_MODE=poll
      VRFW_MAX_ATTEMPTS: "3"
      VRFW_RETRY_BACKOFF_SECONDS: "900"

      VRFW_PACKAGING_SUBCOMMAND: session
      VRFW_PACKAGING_EXTRA_ARGS: "[]"  # e.g. '["--write-nwb"]'
      VRFW_PACKAGING_TIMEOUT_SECONDS: "3600"
      VRFW_UPLOAD_TIMEOUT_SECONDS: "7200"

      # false: only sessions appearing after this container's first start are
      # ever uploaded (existing ones are marked pre_existing and skipped).
      VRFW_PROCESS_EXISTING: "true"
      VRFW_DRY_RUN: "false"
      VRFW_LOG_LEVEL: INFO
    volumes:
      # HOST_RAW_DIR and HOST_AWS_DIR come from .env (never committed).
      - "${HOST_RAW_DIR}:/data/raw:ro"
      # /config is $HOME in the image (not /root: that's root-only, unreadable by
      # the non-root user: above).
      - "${HOST_AWS_DIR}:/config/.aws:ro"
      - state:/data/state
      - scratch:/data/scratch
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  state:
  scratch:
